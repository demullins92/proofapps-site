name: Test Expo Push Delivery

on:
  workflow_dispatch:

jobs:
  send-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send test push to Expo
        env:
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          curl -X POST https://exp.host/--/api/v2/push/send \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $EXPO_ACCESS_TOKEN" \
            -d '{
              "to": "ExponentPushToken[_Z8Z2YMM6Bv82nZKY0TDV2]",
              "title": "Low stock",
              "body": "GitHub Actions cross-cloud test",
              "priority": "high",
              "data": { "location_id": "test", "bottle_names": ["Test Bottle"] }
            }'
